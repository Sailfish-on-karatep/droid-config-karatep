# Bluetooth and WLAN share one WCNSS/pronto SoC on karatep (MSM8937).
#
# bluebinder.service ships with only "After=droid-hal-init.service", so at boot
# it starts ~12 s before `modprobe wlan` has finished bringing that SoC up. It
# wins the race, the wlan driver then loads into a poisoned SoC and returns
# ENODEV (no wlan0), and bluebinder's own init fails too -- restart-looping
# every 61 s, which is TimeoutStartSec=60 plus Restart=always.
#
# Ordering it after the module load fixes both radios at once. This only works
# because wlan-module-load.service is Type=oneshot; as Type=simple it reported
# "started" 12 s early and this After= did nothing at all. Keep the two together.
#
# Verified on hardware:
#   [11.909] Starting Load wlan module...
#   [24.299] wlan: driver loaded
#   [24.303] Started Load wlan module.
#   [24.443] bluebinder: Own hci index: 1
#   [24.518] bluebinder: Bluetooth binder initialized successfully
#   [24.675] bluebinder: Successfully initialized vhci bluetooth
[Unit]
After=wlan-module-load.service
