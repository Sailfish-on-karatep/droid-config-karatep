# BT and WLAN share one WCNSS SoC. bluebinder ships ordered only after
# droid-hal-init, so it wins the race against `modprobe wlan` (~12 s): the wlan
# driver then gets ENODEV and bluebinder restart-loops every 61 s. Ordering it
# after the module load fixes both, and only works because
# wlan-module-load.service is Type=oneshot -- keep the two together.
[Unit]
After=wlan-module-load.service
