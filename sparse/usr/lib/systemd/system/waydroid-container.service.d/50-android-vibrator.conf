[Unit]
# Waydroid's container cannot finish booting Android without the host's
# vibrator HAL -- see android-vibrator-hal.service for the full chain. Pull it
# in here rather than enabling it globally, so the HAL is running exactly when
# Waydroid needs it and never otherwise.
#
# Wants, not Requires: a failure to start the HAL should leave Waydroid to fail
# with its own diagnosis in waydroid.log rather than have systemd refuse to
# start the container at all.
Wants=android-vibrator-hal.service
After=android-vibrator-hal.service
