# Declare karatep's capacitive keys to ssu-sysinfo. The touchscreen controller
# emits all three already, but lipstick only loads HardwareKeyHandler.qml when
# the device declares Key_HomePage, so home and menu went nowhere. Back worked
# throughout: it is an ordinary Qt::Key_Back handled by applications.
#
# The file name must contain "hw-settings" or ssu-sysinfo never globs it, and
# the values must be numeric Qt key codes -- hw_key_parse() stops at the first
# token strtoul() cannot read, so names silently yield an empty list.
#
#   0x01000090 Key_HomePage, 0x01000061 Key_Back, 0x01000055 Key_Menu
[Keys]
Keys=0x01000090,0x01000061,0x01000055
