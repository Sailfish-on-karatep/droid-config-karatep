# Declare karatep's capacitive hardware keys to ssu-sysinfo.
#
# WHY THIS FILE EXISTS
# --------------------
# The three capacitive keys below the screen are emitted by the touchscreen
# controller, not by gpio-keys. From /proc/bus/input/devices:
#
#     N: Name="fts_ts"
#     S: Sysfs=/devices/soc/78b7000.i2c/i2c-3/3-0038/input/input1
#     B: KEY=400 0 0 100040008800 0 0
#
# Decoding that KEY bitmask (words are most-significant-first; the 0x100040008800
# word covers keycodes 128-191, bits 11/15/30/44) gives:
#
#     139 KEY_MENU      -> the "square" / app-switcher key
#     143 KEY_WAKEUP
#     158 KEY_BACK      -> back key
#     172 KEY_HOMEPAGE  -> home key
#
# So the kernel was always emitting all three. The reason home and the square
# key did nothing is entirely on the Sailfish side: lipstick only loads its
# hardware key handler when the device declares Key_HomePage. From
# /usr/share/lipstick-jolla-home-qt5/compositor.qml:
#
#     Loader {
#         active: deviceInfo.hasHardwareKey(Qt.Key_HomePage)
#         source: "compositor/HardwareKeyHandler.qml"
#     }
#
# Without this file `ssu-sysinfo -k` prints nothing, hasHardwareKey() is false,
# HardwareKeyHandler.qml is never instantiated, and the key presses go nowhere.
# Back kept working because it is an ordinary Qt::Key_Back that applications
# handle themselves, independent of that handler.
#
# (Confirmed by spiiroin, who maintains mce/lipstick, on #sailfishos-porters
# 2019-12-20: "you need to have Key_HomePage in hw settings for lipstick to
# handle those android keys ... ssu-sysinfo --has-hw-key=Key_HomePage".)
#
# FORMAT
# ------
# ssu-sysinfo globs /usr/share/csd/settings.d/*hw-settings*.ini -- the file name
# MUST contain "hw-settings" or it is never read -- and looks up the "Keys" key
# of the "[Keys]" section (lib/ssusysinfo.c, ssusysinfo_get_hw_keys()).
#
# The values must be NUMERIC Qt key codes, not names. hw_key_parse() parses with
# strtoul(pos, &end, 0) and stops at the first token that is not a number, so
# "Key_HomePage" silently yields an empty list. Verified on device: with the
# numeric form below, `ssu-sysinfo -k` prints Key_Menu / Key_Back / Key_HomePage.
#
#     0x01000090  Qt::Key_HomePage  (home)
#     0x01000061  Qt::Key_Back      (back)
#     0x01000055  Qt::Key_Menu      (square / app switcher)
#
# Codes are from lib/hw_key.c in sailfishos/ssu-sysinfo.
[Keys]
Keys=0x01000090,0x01000061,0x01000055
