[features]
AudioMic1=1
AudioMic2=1
BackCamera=1
BackCameraFlash=1
Backlight=1
Battery=1
Bluetooth=1
CellularData=1
CellularVoice=1
ECompass=1
FmRadio=1
FrontCamera=1
FrontCameraFlash=0
GPS=1
CellInfo=1
GSensor=1
Gyro=1
# karatep has no hall/cover sensor. Verified three ways: no hall device in
# /proc/bus/input/devices, /sys/class/switch holds only h2w and wfd, and no hall
# driver in karatep_defconfig or either device tree (the only dts in the kernel
# mentioning one is msm8909-qrd-skue.dtsi, a different board). csd's own probe
# reads /proc/irq/396/sensor_hall, which does not exist here either.
# Declaring it made ssu-sysinfo advertise Feature_CoverSensor and put a
# VerificationHallDetect test in CSD that can never pass.
Hall=0
Fingerprint=1
Headset=1
Key=1
LCD=1
LED=1
LightSensor=1
Loudspeaker=1
TOH=0
ProxSensor=1
Receiver=1
SDCard=1
SIM=1
StereoLoudspeaker=0
Touch=1
TouchAuto=0
UsbCharging=1
UsbOtg=1
Vibrator=1
Wifi=1
VideoPlayback=1

# The factory and run-in test sets. Without these keys csd falls back to the
# built-in default lists compiled into /usr/bin/csd, which include tests for
# hardware karatep does not have.
#
# Most tests are already gated by [features] above -- csd skips any test whose
# feature is 0 -- so this section exists for the ones that are not, and to make
# the set explicit rather than inherited. Values are comma-separated with no
# spaces: QSettings does not trim whitespace when splitting a QStringList.
#
# Dropped from csd's default factory set, and why:
#   VerificationHallDetect        no hall sensor (see Hall=0 above)
#   VerificationNfc               no NFC hardware
#   AudioPlayStereoLoudspeaker    single loudspeaker (StereoLoudspeaker=0)
#   VerificationButtonBacklight   no button-backlight node in /sys/class/leds;
#                                 karatep's capacitive keys are unlit, and there
#                                 is no ButtonBacklight feature key to gate it
#
# Everything else is kept, including tests for subsystems that are unverified
# rather than absent -- ProxSensor, Gyro and Ecompass have hardware that has
# simply never been read on Sailfish, and the test is how that gets settled.
# Tests outside this set are still reachable through CSD's "All tests" list;
# VerificationSuspend in particular is worth running by hand.
[tests]
factory-tests=TouchSelfTest,VerificationTouch,VerificationMultiTouch,VerificationLcd,VerificationLcdBacklight,VerificationLightSensor,VerificationProxSensor,VerificationGyroAndGSensor,VerificationEcompass,VerificationFingerprint,VerificationAudio1Mic,VerificationAudio2Mic,AudioPlayMusicLoudspeaker,AudioPlayMusicReceiver,VerificationHeadsetButtons,VerificationHeadset,AudioPlayMusicHeadset,VerificationFrontCamera,VerificationBackCamera,VerificationWifi,VerificationBluetooth,VerificationGpsRadio,VerificationFmRadio,VerificationBattery,VerificationUsbCharging,VerificationLED,VerificationVibrator,VerificationSim,VerificationSdCard,VerificationKey,VerificationUsbOtg
run-in-tests=VerificationVideoPlayback

[BackCamera]
Flash=1
# Focus modes:
# 1 == Manual
# 2 == Hyperfocal
# 4 == Infinity
# 8 == Auto
# 16 == Continious
# 32 == Manual
#FocusMode=8

#[FrontCamera]
#FocusMode=2

# Each RunInTest can be configured to have a pass rate requirement.
# By default we're expecting 100% pass rate.
[FrontBackCamera]
RunInTestPassRateRequirement=0.95

[LED]
# Supported types are: Binary, White, AmberGreen, RedGreen, and RGB
#
# karatep has a single white LED on /sys/class/leds/green, driven through mce's
# "white" backend (see 60-karatep-led.ini). RGB is not just inaccurate, it makes
# the test unpassable: VerificationLED.qml's RGB branch queues PatternCsdRed/
# Green/BlueSolid and asks the tester "Is red LED on?" while a white LED lights.
# White queues PatternCsdWhiteSolid + PatternCsdWhiteBlink, both defined in
# 30csdpatterns.ini as ffffff, which is what this LED can actually do.
LedType=White

[SIM]
ModemCount=2

[FmRadio]
DefaultFrequency=93.5
InputDevice=input-fm_tuner

# Defaults should be fine for most of the devices,
# but in case one wants to loosen or stricten the defaults
# it can be done here.
#[GSensor]
#MinY=-1.0
#MaxY=1.0
#MinX=-1.0
#MaxX=1.0
#MinZ=8.8
#MaxZ=10.8

# As for GSensor, default should be fine, but if need adjustment
# Min and Max values set min and max for all axis X, Y and Z
#[Gyro]
#Min=-1.3
#Max=1.3

[Battery]
VoltageTest=False

[Audio]
RecordTopDevice=input-builtin_mic
RecordBottomDevice=input-builtin_mic
RecordTopDeviceChannel=left
RecordBottomDeviceChannel=right
