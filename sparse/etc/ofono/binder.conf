# Ofono binder plugin configuration for karatep.
#
# This replaces ril_subscription.conf, which belonged to the legacy grilio
# stack (ofono-ril-plugin + ofono-ril-binder-plugin). ofono-binder-plugin
# Obsoletes both of those, and only it can load IMS extensions.
#
# binder.d/dual-sim.conf (from droid-configs-device) appends slot2.

[Settings]

# hwservicemanager on this device publishes only android.hardware.radio@1.0
# and @1.1 -- verified with lshal. The plugin defaults to 1.2, which would
# find no IRadio at all, so this has to be pinned.
radioInterface=1.1

# This modem is 4G. It has no NR at all.
#
# ofono-binder-plugin defaults techs to OFONO_RADIO_ACCESS_MODE_ALL and is
# supposed to mask NR off for HIDL IRadio below 1.4 -- see the
# "limit technologies based on radioInterface" block in binder_plugin.c.
# That did not happen here even with radioInterface pinned to 1.1, so ofono
# advertised nr in AvailableTechnologies, Settings offered a 5G option, the
# stored TechnologyPreference became "nr", and the modem -- unable to honour
# it -- dropped all the way to HSPA. That took VoLTE down with it, since IMS
# needs LTE. Pinning the list explicitly is the reliable fix.
#
# "technologies" is a real slot key (BINDER_CONF_SLOT_TECHNOLOGIES) but is
# absent from upstream's sample binder.conf, so it is easy to miss.
technologies=gsm,umts,lte

# Name the slot we expect, so ofono cannot start ahead of the modem
# adaptation and miss it. The drop-in adds slot2.
ExpectSlots=slot1

# VoLTE. Loads ofono-binder-plugin-ext-qti, which drives
# vendor.qti.hardware.radio.ims@1.0::IImsRadio -- imsradio0 and imsradio1 are
# both registered and live on this device -- and publishes
# org.ofono.IpMultimediaSystem. The plugin registers itself under the name
# "qti" (qti_ext.c: qti_plugin_name).
extPlugin=qti

# Carried over from the ril_subscription.conf this file replaces, both of
# which came from the droid-configs-device Android 11 template.
SetRadioCapability=off
replaceStrangeOperatorNames=true

# Deliberately NOT carried over from droid-configs-device's Android 11
# ril_subscription.conf template: useDataProfiles, mmsDataProfileId,
# allowDataReq and umtsNetworkMode. Mobile data was verified working on this
# device without any of them (see docs/rca/mobile-data-no-dsi-handle.md), so
# importing them would be changing a working configuration on speculation.
# emptyPinQuery is likewise left at the plugin default; both SIMs report
# PinRequired: none, so it has nothing to act on here.

[slot1]
path = /ril_0
slot = 0
