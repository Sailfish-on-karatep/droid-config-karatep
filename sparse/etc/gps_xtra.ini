# Force GNSS assistance injection.
#
# karatep's vendor GNSS HAL never asks for assistance. The modem requests it --
# QMI_LOC_EVENT_INJECT_TIME_REQ_IND_V02 arrives on every session -- but the HAL
# does not propagate that to its client: geoclue-providers-hybris handles
# GNSS_REQUEST_TIME_CB correctly and the callback simply never fires. The same
# is true for XTRA. So nothing was ever injected and every fix attempt was a
# cold start with no ephemeris and no time.
#
# These flags make the provider inject both itself at positioning start rather
# than waiting to be asked. Verified on hardware:
#
#     Forcing XTRA data injection
#     Forcing NTP injection
#     Got NTP response from QHostAddress("139.59.55.93")
#     injected 185775 bytes of xtra data
#
# The XTRA servers have to be repeated here: the provider reads them from this
# file's [xtra] section, not from gps.conf, and without them it has nowhere to
# download from. These are the same URLs gps.conf lists.
#
# No [supl] section on purpose. The provider would take SUPL_HOST/SUPL_PORT
# from here, but SUPL needs ofono's default data modem to open a connection and
# this device has none (dummy SIM, mobile data not working), so it would be
# configuration that cannot be exercised.

[ntp]
NTP_FORCE_INJECT=true

[xtra]
XTRA_FORCE_INJECT=true
XTRA_SERVER_0=http://gllto.glpals.com/7day/v5/latest/lto2.dat
XTRA_SERVER_1=http://gllto1.glpals.com/7day/v5/latest/lto2.dat
XTRA_SERVER_2=http://gllto2.glpals.com/7day/v5/latest/lto2.dat
