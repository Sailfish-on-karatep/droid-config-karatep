# Force GNSS assistance injection: karatep's HAL never asks its client for
# time or XTRA -- the callbacks simply never fire -- so every fix was a cold
# start. These flags make geoclue-providers-hybris inject both at positioning
# start instead.
#
# The servers are repeated here because the provider reads them from this file,
# not gps.conf. https, not gps.conf's http: the payload goes straight into the
# GNSS engine. Time injection is still plain NTP; that is the protocol.
#
# No [supl] section: SUPL needs a default data modem, which this device has not.

[ntp]
NTP_FORCE_INJECT=true

[xtra]
XTRA_FORCE_INJECT=true
XTRA_SERVER_0=https://gllto.glpals.com/7day/v5/latest/lto2.dat
XTRA_SERVER_1=https://gllto1.glpals.com/7day/v5/latest/lto2.dat
XTRA_SERVER_2=https://gllto2.glpals.com/7day/v5/latest/lto2.dat
