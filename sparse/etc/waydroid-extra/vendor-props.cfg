# Host vendor property namespaces to copy into the Waydroid container.
#
# Waydroid's Halium path mounts a generic vendor image over /vendor and rbinds
# this device's real vendor partition at /vendor_extra. The container therefore
# keeps loading karatep's own vendor libraries while losing the vendor
# properties that tune them, because those live on the partition that got
# covered up.
#
# For video that is fatal rather than cosmetic. vendor.prop sets
# vendor.vidc.disable.split.mode=1 because msm8937's Venus firmware cannot do a
# split DPB/OPB; without it libOmxVdec asks for one anyway and the firmware
# rejects every decode session with HFI_ERR_SESSION_UNSUPPORTED_PROPERTY, so no
# video plays inside Waydroid at all. The encoder knobs in the same namespace
# were missing for the same reason.
#
# Only the namespaces are named here. The values are read from the running
# host, so this file never needs updating when vendor.prop changes.
#
# See karatep-port/docs/rca/waydroid-video-decode-split-mode.md.

[host_props]
propagate_prefixes = vendor.vidc., vidc.
