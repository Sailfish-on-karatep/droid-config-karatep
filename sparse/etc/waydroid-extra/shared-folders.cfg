# Folders Waydroid shares with Sailfish, read by get_shared_folders() in
# waydroid's tools/helpers/lxc.py.
#
#   <folder in Android's shared storage> = <path on the host, taken relative to
#                                           the session user's home>
#
# Each one is bind-mounted into the container's /data/media/0 for the life of
# the session, so both sides see the same files: Android creates them
# media_rw:media_rw 0664 and the Sailfish user is in the media_rw group, and
# Sailfish's own 0644 files are readable and writable from Android.
#
# The mapping is the Sailfish home layout, which does not use Android's names --
# Sailfish keeps videos in Videos and downloads in Downloads, Android calls the
# same things Movies and Download.
#
# Deliberately not shared:
#
#   DCIM      Android's camera writes to DCIM/Camera and Sailfish's to
#             Pictures/Camera. Mapping DCIM onto Pictures would mount the same
#             directory in two places and have MediaProvider index every photo
#             twice; mapping it onto Pictures/Camera would give
#             Pictures/Camera/Camera. Left alone until there is a better answer.
#   Android/  App-private storage. Never share anything an app owns.
#
# MediaProvider keeps a .thumbnails cache inside each folder it indexes, so
# these directories will grow one after the first Waydroid session.

[shared_folders]
Pictures = Pictures
Movies = Videos
Music = Music
Download = Downloads
Documents = Documents
