# CONFIG_ANDROID_PARANOID_NETWORK (required for rild) refuses AF_INET sockets
# to processes outside gid 3003, "inet". droid-hal-device adds the user account,
# but Sailfish 5.x resolves through systemd-resolved, which runs as its own
# system user -- so every DNS query failed with EPERM while root worked. A group
# check, so the unit's CAP_NET_RAW does not help.
[Service]
SupplementaryGroups=inet
