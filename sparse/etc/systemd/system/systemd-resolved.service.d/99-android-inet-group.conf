# Give systemd-resolved permission to open network sockets.
#
# The karatep kernel is built with CONFIG_ANDROID_PARANOID_NETWORK=y, which it
# must be: per hadk-faq, "since hybris-12.1, rild does not work without
# ANDROID_CONFIG_PARANOID_NETWORK", so turning it off would cost us cellular.
# With it on, the kernel refuses socket(AF_INET, ...) for any process whose
# groups do not include AID_INET (gid 3003, "inet") -- the call fails with
# EPERM before it ever reaches the network.
#
# droid-hal-device autodetects the flag and adds the *user account* to inet
# (hence "defaultuser" in /etc/group), which is the long-documented fix. But
# Sailfish 5.x does DNS through systemd-resolved: connman is built with
# src/dns-systemd-resolved.c and hands the DHCP nameservers over with
# SetLinkDNS on org.freedesktop.resolve1, and /etc/resolv.conf points at the
# 127.0.0.53 stub. systemd-resolved runs as its own system user
# (systemd-resolve, uid 997), which is in no such group, so every query died
# instantly -- resolved logged "Sending query packet" and then cycled servers
# forever, and every lookup returned "All attempts to contact name servers or
# networks failed" while ping/wget as root worked fine.
#
# The unit's AmbientCapabilities=CAP_NET_RAW does not help: this is a group
# check, not a capability check.
[Service]
SupplementaryGroups=inet
