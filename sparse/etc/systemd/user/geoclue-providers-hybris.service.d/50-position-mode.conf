# Request STANDALONE, not MS_BASED, from the GNSS engine.
#
# geoclue-providers-hybris picks the mode from m_agpsEnabled, which it assigns
# from hybrisEnabled() -- whether the provider is enabled at all, not whether
# assistance can be delivered. That is always true while the provider runs, so
# upstream asks for MS_BASED unconditionally.
#
# On karatep MS_BASED does not degrade to autonomous acquisition when the
# assistance never arrives; it stalls the engine outright. The modem repeats
# QMI_LOC_EVENT_WIFI_REQ_IND_V02 and QMI_LOC_EVENT_INJECT_TIME_REQ_IND_V02,
# nothing answers, and mEngineOn stays 0 for the whole session -- no engine
# state indication, no SV info, no NMEA, zero satellites. Measured over a 300 s
# held session. Forcing STANDALONE on the identical build and spot brings the
# engine up and fixes to ~12 m on six satellites.
#
# This restricts nothing that works here. MS_BASED needs SUPL over a default
# data modem, which this device does not have, so the assisted path cannot
# complete either way. XTRA and NTP injection are driven by /etc/gps_xtra.ini
# and are unaffected by the mode -- the engine still gets its ephemeris and
# time. Every constellation stays enabled, and the vendor gps.conf still
# advertises CAPABILITIES=0x17 (MSB and MSA); we simply do not request that
# mode.
#
# Revisit if mobile data ever works on this device: with a real SUPL connection
# MS_BASED would give a much faster first fix than the ~12 minutes a cold
# STANDALONE start takes here.

[Service]
Environment=GEOCLUE_HYBRIS_POSITION_MODE=standalone
