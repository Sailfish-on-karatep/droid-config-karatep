# Memory pressure thresholds for mce on karatep.
#
# mce loads both the memnotify and mempressure modules (10mce.ini), but every
# threshold defaults to 0, which means "disabled". The result is that
# com.nokia.mce.request.get_memory_level returns "unknown" and nothing ever
# tells applications to release memory -- which the HADK hardware adaptation
# checklist calls out as affecting the browser in particular.
#
# The checklist phrases this item as "memnotify patch to kernel + config for
# mce". The kernel patch is NOT needed here. memnotify.c wants /dev/memnotify,
# a Sailfish-specific kernel patch this tree does not carry. mempressure.c is
# the cgroup-based equivalent and needs only CONFIG_MEMCG, which karatep_
# defconfig already sets for Waydroid. Both files it requires are present:
#   /sys/fs/cgroup/memory/memory.usage_in_bytes   (readable)
#   /sys/fs/cgroup/memory/cgroup.event_control    (writable)
# So mempressure does the work and memnotify simply stays idle. Config only.
#
# CAUTION when editing: mce's override parser (gconf_client_load_values() in
# builtin-gconf.c) has no comment syntax at all. It splits every line on the
# first equals sign and looks the left side up as a setting path. Unknown paths
# are discarded harmlessly, but keep equals signs out of comments here so a
# stray line can never be mistaken for a setting.
#
# The file name must also keep matching /etc/mce/[0-9][0-9]*.conf or
# gconf_client_load_overrides() will not glob it at all.
#
# UNITS: page counts of 4096 bytes (mempressure_bytes_to_pages()). Only the
# */used keys are read by mempressure; */active is memnotify-only and is left
# alone deliberately.
#
# DERIVATION -- MemTotal 3690316 kB, i.e. 922579 pages.
#   Measured steady state with the Waydroid container running, the heaviest
#   realistic load on this device: 642738-644498 pages (~2.5 GiB, ~70% of RAM),
#   creeping ~6 MB/min as page cache fills.
#
#   warning   738000 pages -> 2.82 GiB, 80% of RAM, ~365 MB above that baseline
#   critical  830000 pages -> 3.17 GiB, 90% of RAM, ~730 MB above it
#
# CAVEAT: mempressure reads the *root* cgroup's memory usage, which counts
# reclaimable page cache alongside anonymous memory (measured here: 1.47 GiB
# cache against 0.98 GiB rss). Usage therefore drifts upward under normal use
# without indicating real pressure, and the kernel reclaims cache rather than
# letting it climb indefinitely -- so this is a coarse signal and these are
# first-cut values. Re-check them against a genuinely memory-starved session
# (several browser tabs plus Waydroid) before treating them as final.

/system/osso/dsm/memnotify/warning/used=738000
/system/osso/dsm/memnotify/critical/used=830000
