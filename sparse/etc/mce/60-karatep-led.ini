# karatep's single white LED is /sys/class/leds/green (PMI8950 MPP2, PWM), and
# a phantom "red" node makes mce-plugin-libhybris autoprobe its "redgreen"
# backend first. That backend maps colour as (r,g), so any pattern with green
# clear -- PatternCommunication among them -- left the real LED dark. "white"
# maps max(r,g,b) and blinks in software.
[LEDConfigHybris]

BackEnd=white
LedDirectory=/sys/class/leds/green

# mce scales every pattern colour by an ambient-light level before it reaches
# sysfs (sysfs_led_curr.level, sysfs-led-main.c), and 20als-defaults.ini's
# generic curve is written for a bright RGB indicator: it bottoms out at 6%
# and reached only 40% in ordinary room light here. Measured peak on the green
# node over a full breath cycle was 101/255 with that curve against 255/255
# with it flattened -- i.e. it was giving back most of what the 30 mA sink
# bought. karatep's single white LED is weak enough that it needs a floor of
# 50% and full output by ordinary indoor levels; LimitsProfile0 is the stock
# lux ladder, unchanged.
[BrightnessLed]

LimitsProfile0=1;2;4;6;11;19;34;61;109;195;350;417;496;591;703;837;996;1186;1412;1681;2000
LevelsProfile0=50;55;60;64;68;72;76;80;85;90;95;100;100;100;100;100;100;100;100;100;100
