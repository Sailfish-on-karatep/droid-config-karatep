# Notification LED backend for karatep.
#
# karatep has a single WHITE notification LED. The kernel exposes it as
# "green" -- it is PMI8950 MPP2 driven in PWM mode, see
# arch/arm/boot/dts/qcom/karate-common/msm8937-lenovo-common.dtsi:
#
#     qcom,led_mpp_2 { linux,name = "green"; qcom,mode = "pwm"; ... }
#
# A second node, "red", also exists under the charger PMIC
# (/sys/devices/soc/qpnp-smbcharger-17/leds/red) but drives no physical LED.
#
# mce-plugin-libhybris probes its sysfs backends in a fixed order and the
# "redgreen" backend -- whose static probe path list is exactly
# /sys/class/leds/red + /sys/class/leds/green -- is tried BEFORE "white".
# Both directories exist here, so autoprobe always matched "redgreen" and
# mapped pattern colours through led_control_redgreen_map_color():
#
#     if (r || g) { red = r; green = g; } else { red = b; green = b; }
#
# Any pattern with red set but green clear therefore drove only the phantom
# node and left the real LED dark -- including PatternCommunication
# (ff00ff), the generic "you have a notification" pattern, plus
# PatternPowerOff (ff0000) and PatternWebcamActive (7f0000).
#
# Pinning the "white" backend to the green node maps colour as max(r,g,b),
# so every pattern lights the LED, and it sets can_breathe = true so mce
# does blinking in software -- the LED's pwm_us node returns EIO on read
# and is not needed: a plain brightness write is sufficient (verified on
# hardware).
[LEDConfigHybris]

BackEnd=white
LedDirectory=/sys/class/leds/green
