# karatep's single white LED is /sys/class/leds/green (PMI8950 MPP2, PWM), and
# a phantom "red" node makes mce-plugin-libhybris autoprobe its "redgreen"
# backend first. That backend maps colour as (r,g), so any pattern with green
# clear -- PatternCommunication among them -- left the real LED dark. "white"
# maps max(r,g,b) and blinks in software.
[LEDConfigHybris]

BackEnd=white
LedDirectory=/sys/class/leds/green
