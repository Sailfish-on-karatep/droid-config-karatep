# dsme thermal sensor configuration for karatep.
#
# Without this file /etc/dsme is empty, thermalsensor_generic.so logs
# "No thermal config files found", and the thermal manager has no data at all:
#
#   dbus-send --system --print-reply --dest=com.nokia.thermalmanager \
#     /com/nokia/thermalmanager com.nokia.thermalmanager.battery_temperature
#   -> int32 -9999          (the "no data" sentinel)
#
# CSD reads device temperature through that interface, so the HADK hardware
# adaptation checklist lists this as its first item. The kernel had the numbers
# all along -- only the mapping was missing.
#
# Format: hadk/dsme doc/thermal_sensor_config_files.txt. Keys are
#   Name/Temp/Meta/Mode and the six levels Low/Normal/Warning/Alert/Fatal/
#   Invalid, each "<mintemp C> <minwait s> <maxwait s>". Levels must ascend and
#   all six must be present or the sensor is rejected at validation.
#
# NOTE: reaching Fatal on any sensor makes dsme shut the device down. The limits
# below are deliberately well clear of normal operation -- see each sensor.

# --------------------------------------------------------------------------
# Battery -- the sensor CSD actually asks for.
#
# /sys/class/power_supply/battery/temp reports tenths of a degree ("dC"):
# measured 305, 327 and 350 over one session = 30.5 / 32.7 / 35.0 C, tracking
# thermal_zone1 (type "battery", same value in milli-degrees). This path is
# stable -- it is named, not numbered.
#
# Limits are upstream's own reference profile for a Li-ion pack, which is
# conservative enough not to nuisance-trip while charging in a warm room.
Name:    battery
Temp:    /sys/class/power_supply/battery/temp dC
Low:     -99   60   120
Normal:   -4   60   120
Warning:  59   30    60
Alert:    64    5    10
Fatal:    68    5    10
Invalid: 200   60   120

# --------------------------------------------------------------------------
# Core -- SoC junction temperature.
#
# thermal_zone11 is tsens_tz_sensor5, which is the sensor the vendor's own
# msm_thermal block references (msm8937.dtsi: qcom,msm-thermal { qcom,sensor-id
# = <5> }). tsens zones report whole degrees, so the unit is "C", not "mC":
# measured 42-45 C at idle.
#
# These readings only became trustworthy after 3a06ccbcfede -- the inherited
# strlcpy regression truncated "tsens_tz_sensorN" to "tsens_t" and every TSENS
# read failed. Do not restore this file to a kernel without that fix.
#
# Vendor mitigation points from the same dtsi node: limit-temp 60 (frequency
# throttling starts), core-limit-temp 80, hotplug-temp 105, freq-mitigation-temp
# 105. Warning sits above the vendor's core limit, Alert at its hotplug point,
# and Fatal 15 C above that -- if mitigation is working the device never gets
# there, and if it is not, shutting down is the right answer.
#
# Zone numbering is assigned at probe time and is not guaranteed across kernel
# changes. After any kernel bump confirm the mapping still holds:
#   cat /sys/class/thermal/thermal_zone11/type   # must print tsens_tz_sensor5
Name:    core
Temp:    /sys/class/thermal/thermal_zone11/temp C
Low:     -99   60   120
Normal:  -15   60   120
Warning:  95   30    60
Alert:   105    5    10
Fatal:   120    5    10
Invalid: 200   60   120

# --------------------------------------------------------------------------
# Surface -- estimated, not measured.
#
# karatep does have a real case thermistor (thermal_zone4, type "case_therm",
# reading 34-36 C against a 32.7-35.0 C battery), and it is the better long-term
# source. It is left unused for now because it is unvalidated: an unvalidated
# thermistor wired to a level that shuts the device down is not a trade worth
# making on a port whose shutdown path is already unreliable. Upstream's own
# documented fallback -- deriving surface from battery -- costs nothing and adds
# no new failure mode.
#
# To switch over once case_therm has been checked against a real thermometer,
# replace the Meta line with:
#   Temp:    /sys/class/thermal/thermal_zone4/temp C
Name:    surface
Meta:    battery -1
Low:     -99   60   120
Normal:   -1   55    60
Warning:  56   55    60
Alert:    59   20    30
Fatal:    63   20    30
Invalid: 200   60   120
